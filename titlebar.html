<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:;" />
    <title>ArrDeck</title>
    <link rel="stylesheet" href="common.css" />
    <link rel="stylesheet" href="titlebar.css" />
  </head>
  <body>
    <!-- Our title bar, window buttons included. -->
    <header class="bar">
      <svg class="logo" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="4" width="18" height="4" rx="1" /><rect x="3" y="10" width="18" height="4" rx="1" /><rect x="3" y="16" width="18" height="4" rx="1" />
      </svg>
      <span class="brand">ArrDeck</span><button type="button" class="ver" id="ver" title="ArrDeck version - click to check for updates"></button>
      <div class="group">
        <button type="button" class="icon" id="back" title="Back (Alt+Left)">
          <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" /></svg>
        </button>
        <button type="button" class="icon" id="forward" title="Forward (Alt+Right)">
          <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" /></svg>
        </button>
        <button type="button" class="icon" id="reload" title="Reload (F5)">
          <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5" /></svg>
        </button>
      </div>
      <nav class="tabs" id="tabs" role="tablist" aria-label="Apps"></nav>
      <button type="button" class="update hidden" id="update"></button>
      <div class="group">
        <button type="button" class="icon" id="settings" title="ArrDeck settings (Ctrl+,)">
          <svg viewBox="0 0 24 24"><!-- gear: Feather "settings" icon, MIT --><circle cx="12" cy="12" r="3" /><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" /></svg>
        </button>
      </div>
      <!-- ArrDeck draws its own window buttons (Windows' own ones would sit over the white border). -->
      <div class="winctl">
        <button type="button" id="winMin" title="Minimise">
          <svg viewBox="0 0 10 10"><path d="M0 5h10" /></svg>
        </button>
        <button type="button" id="winMax" title="Maximise">
          <svg viewBox="0 0 10 10" class="max"><rect x="0.5" y="0.5" width="9" height="9" /></svg>
          <svg viewBox="0 0 10 10" class="restore"><rect x="0.5" y="2.5" width="7" height="7" /><path d="M2.5 2.5V0.5h7v7h-2" /></svg>
        </button>
        <button type="button" id="winClose" class="close" title="Close">
          <svg viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10" /></svg>
        </button>
      </div>
    </header>
    <script src="titlebar.js"></script>
  </body>
</html>
