<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self';" />
    <title>ArrDeck</title>
    <link rel="stylesheet" href="common.css" />
    <link rel="stylesheet" href="titlebar.css" />
  </head>
  <body>
    <!-- Our title bar. Minimise / maximise / close are drawn by Windows on the right. -->
    <header class="bar">
      <svg class="logo" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="4" width="18" height="4" rx="1" /><rect x="3" y="10" width="18" height="4" rx="1" /><rect x="3" y="16" width="18" height="4" rx="1" />
      </svg>
      <span class="brand">ArrDeck</span><span class="ver" id="ver" title="ArrDeck version"></span>
      <div class="group">
        <button type="button" class="icon" id="back" title="Back (Alt+Left)">
          <svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" /></svg>
        </button>
        <button type="button" class="icon" id="forward" title="Forward (Alt+Right)">
          <svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" /></svg>
        </button>
        <button type="button" class="icon" id="reload" title="Reload (F5)">
          <svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.6M20 4v5h-5" /></svg>
        </button>
      </div>
      <nav class="tabs" id="tabs" role="tablist" aria-label="Apps"></nav>
      <button type="button" class="update hidden" id="update"></button>
      <div class="group">
        <button type="button" class="icon" id="settings" title="ArrDeck settings (Ctrl+,)">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3" /><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1" /></svg>
        </button>
      </div>
    </header>
    <script src="titlebar.js"></script>
  </body>
</html>
